name: ci

on:
  pull_request:
  push:
    branches: [main, 'wsq/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  business-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests/business -t . -v
      - run: python -m unittest discover -s tests/protocol -t . -v
      - run: ruff check apps packages tests
      - run: ruff format --check apps packages tests

  ai-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev-ai.txt
      - run: python -m pip check
      - name: AI environment must not install business or model dependencies
        run: |
          python -c "import importlib.util; names=['celery','redis','sqlalchemy','torch','paddle','onnxruntime']; assert all(importlib.util.find_spec(n) is None for n in names)"
      - run: python -m unittest discover -s tests/ai -t . -v
      - run: python -m unittest discover -s tests/protocol -t . -v

  design-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/design/requirements.txt
      - run: python -B tools/design/build_specs.py --check
      - run: python -B tools/design/test_readiness_design.py
      - run: python -B tools/design/validate_specs.py
      - run: git diff --exit-code

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_ENV: dev
      VITE_APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Reject production fixture builds
        run: |
          if APP_ENV=production VITE_APP_ENV=production npm run build; then
            echo "ERROR: I-01A must reject production builds"
            exit 1
          fi
      - run: git diff --exit-code -- package.json package-lock.json
