name: ci

on:
  pull_request:
  push:
    branches: [main, 'wsq/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  business-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests/business -t . -v
      - run: python -m unittest discover -s tests/protocol -t . -v
      - run: python -m pytest tests/business tests/domain tests/security -q

      - run: ruff check apps packages tests tools/database tools/ml
      - run: ruff format --check apps packages tests tools/database tools/ml


  ai-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev-ai.txt
      - run: python -m pip check
      - name: AI environment must not install business or model dependencies
        run: |

          python -c "import importlib.util; names=['celery','redis','sqlalchemy','alembic','pymysql','argon2','boto3','botocore','torch','paddle','onnxruntime']; assert all(importlib.util.find_spec(n) is None for n in names)"

      - run: python -m unittest discover -s tests/ai -t . -v
      - run: python -m unittest discover -s tests/protocol -t . -v

  ai-cpu-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/py311-ai-real.txt
      - run: python -m pip check
      - run: python -m unittest tests.ai.test_dfine_adapter tests.ai.test_cpu_runner tests.ai.test_cpu_pixels tests.ai.test_ocrv6_adapter tests.ai.test_quality_pixels tests.ai.test_pipeline_cpu tests.ai.test_crop_evidence -v
      # Official weights remain local; real-model smoke is recorded separately.

  design-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/design/requirements.txt
      - run: python -B tools/design/build_specs.py --check
      - run: python -B tools/design/test_readiness_design.py
      - run: python -B tools/design/validate_specs.py
      - run: git diff --exit-code


  persistence-mysql:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql:
        image: mysql:8.0.33
        env:
          # Disposable CI instance only; never use this test credential for deployments.
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-mysql-test-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: test
      CI: 'true'
      LABSAFE_MYSQL_INTEGRATION: '1'
      LABSAFE_CI_MYSQL_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-mysql-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/dev.txt
      - run: python tools/database/run_mysql_tests.py --ci
        env:
          LABSAFE_CI_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          LABSAFE_CI_REDIS_PORT: ${{ job.services.redis.ports[6379] }}


  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_ENV: dev
      VITE_APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Reject production fixture builds
        run: |
          if APP_ENV=production VITE_APP_ENV=production npm run build; then
            echo "ERROR: I-01A must reject production builds"
            exit 1
          fi
      - run: git diff --exit-code -- package.json package-lock.json
