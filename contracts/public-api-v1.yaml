components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: labsafe_session
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 160
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - field
      - reason
      additionalProperties: false
    Error:
      type: object
      properties:
        request_id: &id003
          type: string
          format: uuid
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHENTICATED
              - FORBIDDEN
              - NOT_FOUND
              - STATE_CONFLICT
              - VERSION_CONFLICT
              - IDEMPOTENCY_CONFLICT
              - REQUEST_IN_PROGRESS
              - RATE_LIMITED
              - IMAGE_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - IMAGE_INVALID
              - UNAUTHORIZED_REF
              - OBJECT_NOT_FOUND
              - HASH_MISMATCH
              - MODEL_NOT_READY
              - MODEL_VERSION_UNAVAILABLE
              - AI_BUSY
              - RUN_IN_PROGRESS
              - AI_TIMEOUT
              - STAGE_TIMEOUT
              - MODEL_OOM
              - DEPENDENCY_UNAVAILABLE
              - MODEL_ERROR
              - INTERNAL_ERROR
              - SCHEMA_MISMATCH
              - RULESET_INVALID
              - LEASE_LOST
            message:
              type: string
              minLength: 1
              maxLength: 500
            retryable: &id002
              type: boolean
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
              minItems: 0
              maxItems: 30
          required:
          - code
          - message
          - retryable
          - details
          additionalProperties: false
      required:
      - request_id
      - error
      additionalProperties: false
    Ack:
      type: object
      properties:
        ok: *id002
      required:
      - ok
      additionalProperties: false
    Permission:
      type: object
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 80
        laboratory_id:
          anyOf:
          - *id003
          - type: 'null'
      required:
      - action
      - laboratory_id
      additionalProperties: false
    User:
