[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labsafe"
version = "0.1.0.dev0"
description = "LabSafe inspection and evidence workflow"
requires-python = ">=3.11,<3.12"
readme = "DEVELOPMENT.md"
dependencies = []

[project.optional-dependencies]
storage = ["boto3==1.43.106"]
ai = [
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "uvicorn[standard]==0.34.0",
  "PyYAML==6.0.2",
  "jsonschema==4.23.0",
  "rfc3339-validator==0.1.4",
]
ai-real = [
  "numpy==2.2.2",
  "Pillow==11.3.0",
  "onnxruntime==1.20.1",
  "opencv-python-headless==4.11.0.86",
  "pyclipper==1.3.0.post6",
]
image-evidence = [
  "numpy==2.2.2",
  "Pillow==11.3.0",
  "opencv-python-headless==4.11.0.86",
]
api = [
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "uvicorn[standard]==0.34.0",
]
worker = [
  "celery==5.4.0",
  "redis==5.2.1",
  "Pillow==11.3.0",
]
persistence = [
  "alembic==1.14.1",
  "sqlalchemy==2.0.37",

  "pymysql[rsa]==1.1.1",
  "argon2-cffi==23.1.0",
  "tzdata==2026.4",

]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.3",
  "mypy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
namespaces = false

[tool.setuptools.package-data]
"packages.inference_protocol" = ["contract.json"]
"apps.ai_inference" = ["fixtures/*.json"]

"packages.persistence.migrations" = ["snapshots/*.json", "snapshots/*.sql"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
